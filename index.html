<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somaport RTG System</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

:root{
    --green:#00ff9d;
    --navy:#07111f;
    --glass:rgba(255,255,255,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:linear-gradient(135deg,#050b16,#07111f,#0d1e36);
    color:white;
    min-height:100vh;
}

/* LOGIN */

.login{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#00ff9d22,#000);
}

.login-box{
    width:90%;
    max-width:400px;
    padding:30px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    backdrop-filter:blur(15px);
    text-align:center;
}

.login-box h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    border:none;
    outline:none;
}

button{
    width:100%;
    padding:15px;
    background:var(--green);
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

/* DASHBOARD */

.dashboard{
    display:none;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:rgba(255,255,255,0.05);
    border-radius:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    background:rgba(255,255,255,0.06);
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

h3{
    margin-bottom:10px;
    color:var(--green);
}

/* TABLE */

table{
    width:100%;
    margin-top:10px;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.action{
    cursor:pointer;
    color:red;
}

/* ADD */

.add{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.add input{
    flex:1;
}

.add button{
    width:auto;
    padding:10px 15px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
    <div class="login-box">
        <h2>🔐 Somaport RTG Login</h2>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Enter System</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">

    <div class="header">
        <h2>🚜 RTG Operations System</h2>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="grid">

        <div class="card">
            <h3>📅 Date</h3>
            <p>10/05/2026</p>
        </div>

        <div class="card">
            <h3>🚜 Machine</h3>
            <p>RTG N° 8</p>
        </div>

        <div class="card">
            <h3>👥 Binômes</h3>

            <div class="add">
                <input id="b1" placeholder="A">
                <input id="b2" placeholder="B">
                <button onclick="addPair()">+</button>
            </div>

            <table id="table"></table>

        </div>

        <div class="card">
            <h3>🏖️ Congés</h3>

            <input id="name" placeholder="Nom">
            <input id="leave" placeholder="Sortie">
            <input id="back" placeholder="Entrée">

            <button onclick="addLeave()">Ajouter</button>

            <table id="leaveTable"></table>

        </div>

    </div>

</div>

<script>

let pairs = JSON.parse(localStorage.getItem("pairs") || "[]");
let leaves = JSON.parse(localStorage.getItem("leaves") || "[]");

function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u && p){
        document.getElementById("login").style.display="none";
        document.getElementById("dash").style.display="block";
        render();
    }else{
        alert("دخل المعلومات");
    }
}

function logout(){
    location.reload();
}

function addPair(){
    let a = document.getElementById("b1").value;
    let b = document.getElementById("b2").value;

    if(a && b){
        pairs.push({a,b});
        localStorage.setItem("pairs",JSON.stringify(pairs));
        render();
    }
}

function addLeave(){
    let n = document.getElementById("name").value;
    let s = document.getElementById("leave").value;
    let e = document.getElementById("back").value;

    leaves.push({n,s,e});
    localStorage.setItem("leaves",JSON.stringify(leaves));
    render();
}

function render(){

    let t = "<tr><th>A</th><th>B</th></tr>";

    pairs.forEach((p,i)=>{
        t += `<tr>
            <td>${p.a}</td>
            <td>${p.b}</td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = t;

    let l = "<tr><th>Nom</th><th>Sortie</th><th>Entrée</th></tr>";

    leaves.forEach(v=>{
        l += `<tr>
            <td>${v.n}</td>
            <td>${v.s}</td>
            <td>${v.e}</td>
        </tr>`;
    });

    document.getElementById("leaveTable").innerHTML = l;
}

</script>

</body>
</html>
