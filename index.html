<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTG Planning - Somaport</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#0b1626;
    color:white;
    padding:15px;
}

/* HEADER */

.header{
    text-align:center;
    padding:20px;
    background:#0f2238;
    border-radius:15px;
    border:1px solid #ffffff10;
}

.header h1{
    color:#00ff9d;
    font-size:28px;
}

.header h2{
    font-size:18px;
    margin-top:5px;
}

/* SECTION */

.section{
    margin-top:15px;
    background:#0f2238;
    padding:15px;
    border-radius:15px;
    border:1px solid #ffffff10;
}

/* TITLE */

.title{
    text-align:center;
    color:#00ff9d;
    margin-bottom:10px;
    font-weight:800;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ffffff10;
}

/* RTG BADGE */

.rtg{
    display:inline-block;
    margin-top:10px;
    padding:6px 20px;
    background:#00ff9d22;
    color:#00ff9d;
    border-radius:20px;
    font-weight:800;
}

/* CONGÉ */

.conge{
    text-align:center;
    line-height:2;
    font-size:18px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Somaport - RTG Planning</h1>
    <h2>Démonche 10/05/2026</h2>
    <div class="rtg">🚜 RTG N° 8</div>
</div>

<!-- BINOMES -->
<div class="section">

    <div class="title">👥 Les Binômes</div>

    <table>

        <tr><td>Farih</td><td>//</td><td>Rmaili</td></tr>
        <tr><td>Mandour</td><td>//</td><td>Banhadrya</td></tr>
        <tr><td>Amin</td><td>//</td><td>Ousama</td></tr>
        <tr><td>Anbry</td><td>//</td><td>Asli</td></tr>
        <tr><td>Bentata</td><td>//</td><td>Madak</td></tr>
        <tr><td>Jaaouiani</td><td>//</td><td>Errakhmi</td></tr>
        <tr><td>Lamnabbah</td><td>//</td><td>Ramadan</td></tr>
        <tr><td>Zaoui</td><td>//</td><td>Mabsout</td></tr>

    </table>

</div>

<!-- CONGÉ -->
<div class="section">

    <div class="title">🏖️ Congé</div>

    <div class="conge">
        Balhawi<br>
        (Sorti) Lundi<br>
        (Entré) Lundi soir
    </div>

</div>

</body>
</html>
