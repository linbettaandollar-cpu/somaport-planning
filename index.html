<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somaport - Planning RTG Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #003366; --orange: #ff6600; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 30px; border-bottom: 6px solid var(--orange); text-align: center; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 2.5rem; font-weight: 900; color: var(--blue); margin: 0; letter-spacing: 2px; text-transform: uppercase;}
        .title-sub { font-size: 1.2rem; color: #555; margin-top: 5px; font-weight: 700; }
        .date-badge { display: inline-block; background: var(--blue); color: white; padding: 8px 25px; border-radius: 50px; margin-top: 15px; font-weight: bold; font-size: 1.1rem; text-transform: capitalize; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 8px solid var(--blue); transition: 0.3s; text-align: center; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .binome-tag { color: var(--orange); font-weight: 900; font-family: 'Outfit', sans-serif; font-size: 1.3rem; margin-bottom: 15px; display: block; text-transform: uppercase; }
        .names { display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 1.5rem; font-weight: 800; font-family: 'Outfit', sans-serif; color: #222; }
        .conge-card { border-left-color: #dc3545; background: #fff5f5; }
        .conge-tag { color: #dc3545; }
        #loader { font-size: 1.5rem; color: var(--blue); margin-top: 50px; font-weight: bold; text-align: center; }
        .error-msg { color: red; font-weight: bold; text-align: center; margin-top: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo">Somaport</h1>
        <div class="title-sub">Planning RTG - Live Update</div>
        <div class="date-badge" id="live-date">...</div>
    </div>

    <div id="loader">⏳ Chargement des données... (جاري جلب البلانينڭ)</div>
    <div class="grid" id="container"></div>

    <script>
        // هادا هو الرابط السحري ديالك
        const apiURL = "https://api.sheetbest.com/sheets/b6e3ae1f-2190-406c-8264-091975545af0";

        // تحديد التاريخ ديال اليوم أوتوماتيكيا بالفرنسية
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('fr-FR', options);

        async function getData() {
            try {
                const res = await fetch(apiURL);
                const data = await res.json();
                
                const container = document.getElementById('container');
                document.getElementById('loader').style.display = 'none';

                data.forEach(item => {
                    // يلا كانت السطر خاوي فـ Google Sheets، الكود غايفوتو
                    if(!item.binome_number && !item.partner1) return;

                    // يلا لقى كلمة CONGÉ، غايبدل اللون لـ الحمر
                    const isConge = item.binome_number && item.binome_number.toUpperCase().includes('CONGÉ');
                    
                    const card = `
                        <div class="card ${isConge ? 'conge-card' : ''}">
                            <span class="binome-tag ${isConge ? 'conge-tag' : ''}">${item.binome_number || ''}</span>
                            <div class="names">
                                <span>${item.partner1 || ''}</span>
                                ${item.partner2 ? '<span style="color: #ccc;">|</span>' : ''}
                                <span>${item.partner2 || ''}</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('container').innerHTML = "<div class='error-msg'>❌ خطا في الاتصال. تأكد أن ملف Google Sheets مشارك مع الجميع.</div>";
            }
        }

        getData();
    </script>
</body>
</html>
