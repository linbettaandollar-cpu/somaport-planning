<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somaport Live Control Room</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:#050b14;
    color:white;
    overflow:hidden;
}

/* TOP */

.topbar{
    padding:15px;
    background:#0b1a2c;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #00ff9d33;
}

.badge{
    background:#00ff9d22;
    color:#00ff9d;
    padding:5px 15px;
    border-radius:20px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    height:calc(100vh - 60px);
}

/* MAP */

.map{
    position:relative;
    background:linear-gradient(135deg,#0a1a2e,#07111f);
    border-left:1px solid #00ff9d22;
    overflow:hidden;
}

/* container zones */

.zone{
    position:absolute;
    width:120px;
    height:120px;
    background:#00ff9d10;
    border:1px solid #00ff9d33;
    border-radius:10px;
}

/* RTG */

.rtg{
    position:absolute;
    width:30px;
    height:30px;
    background:#00ff9d;
    border-radius:6px;
    box-shadow:0 0 20px #00ff9d;
}

/* LEFT PANEL */

.panel{
    padding:15px;
    overflow:auto;
}

.card{
    background:#0b1626;
    margin-bottom:15px;
    padding:15px;
    border-radius:15px;
    border:1px solid #ffffff10;
}

.title{
    color:#00ff9d;
    margin-bottom:10px;
    font-weight:800;
}

.status{
    display:flex;
    justify-content:space-between;
    margin:5px 0;
}

/* BUTTON */

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00ff9d;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="topbar">
    <div>🚢 SOMAPORT LIVE CONTROL ROOM</div>
    <div class="badge">LIVE SYSTEM</div>
</div>

<div class="grid">

    <!-- LEFT PANEL -->
    <div class="panel">

        <div class="card">
            <div class="title">🚜 RTG STATUS</div>
            <div class="status"><span>RTG 8</span><span>ACTIVE 🟢</span></div>
            <div class="status"><span>LOAD</span><span id="load">MEDIUM</span></div>
        </div>

        <div class="card">
            <div class="title">📊 OPERATIONS</div>
            <div class="status"><span>Containers</span><span id="c">12</span></div>
            <div class="status"><span>Moves</span><span id="m">0</span></div>

            <button onclick="start()">START SIMULATION</button>
        </div>

    </div>

    <!-- MAP -->
    <div class="map">

        <!-- ZONES -->
        <div class="zone" style="top:50px;right:50px;"></div>
        <div class="zone" style="top:200px;right:200px;"></div>
        <div class="zone" style="top:350px;right:80px;"></div>

        <!-- RTG -->
        <div class="rtg" id="rtg"></div>

    </div>

</div>

<script>

let rtg = document.getElementById("rtg");
let x = 50;
let y = 50;
let moves = 0;
let running = false;

function moveRTG(){

    if(!running) return;

    x += (Math.random()*40 - 20);
    y += (Math.random()*40 - 20);

    x = Math.max(20, Math.min(window.innerWidth/2, x));
    y = Math.max(20, Math.min(window.innerHeight, y));

    rtg.style.right = x + "px";
    rtg.style.top = y + "px";

    moves++;
    document.getElementById("m").innerText = moves;

    let load = document.getElementById("load");

    if(moves < 10) load.innerText = "LOW";
    else if(moves < 25) load.innerText = "MEDIUM";
    else load.innerText = "HIGH";

    setTimeout(moveRTG,800);
}

function start(){
    running = true;
    moveRTG();
}

</script>

</body>
</html>
