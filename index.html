<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Somaport SAP RTG System</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --green:#00ff9d;
    --navy:#07111f;
    --dark:#050b16;
    --glass:rgba(255,255,255,0.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:linear-gradient(135deg,#020813,#07111f,#0d1e36);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* LOGIN */

.login{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#00ff9d22,#000);
    z-index:999;
}

.login-box{
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
}

input,select{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:var(--green);
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

/* DASHBOARD */

.dashboard{
    display:none;
}

/* TOP BAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
}

.role{
    padding:6px 15px;
    border-radius:20px;
    background:#00ff9d22;
    color:var(--green);
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
}

/* RTG STATUS */

.status{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

/* TABLE */

table{
    width:100%;
    margin-top:10px;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    text-align:center;
}

/* CHART */

canvas{
    margin-top:10px;
}

/* MOBILE */

@media(max-width:768px){
    .topbar{
        flex-direction:column;
        gap:10px;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">

    <div class="login-box">

        <h2>🚢 SOMAPORT SAP LOGIN</h2>

        <input id="user" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">

        <select id="role">
            <option value="operator">Operator RTG</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Admin</option>
        </select>

        <button onclick="login()">Enter System</button>

    </div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">

    <div class="topbar">

        <h2>🚜 RTG PORT CONTROL SYSTEM</h2>

        <div class="role" id="roleBox">Operator</div>

    </div>

    <div class="grid">

        <!-- RTG STATUS -->
        <div class="card">

            <h3>🚜 RTG STATUS</h3>

            <div class="status">
                <span>RTG 8</span>
                <div class="dot"></div>
            </div>

            <div class="status">
                <span>Fuel</span>
                <span>87%</span>
            </div>

            <div class="status">
                <span>Work Load</span>
                <span>High</span>
            </div>

        </div>

        <!-- OPERATIONS -->
        <div class="card">

            <h3>⚙️ Operations</h3>

            <table id="ops"></table>

            <input id="task" placeholder="New Task">
            <button onclick="addTask()">Add Operation</button>

        </div>

        <!-- BINÔMES -->
        <div class="card">

            <h3>👥 Binômes</h3>

            <table id="pairs"></table>

        </div>

        <!-- CHART -->
        <div class="card">

            <h3>📊 Productivity</h3>

            <canvas id="chart"></canvas>

        </div>

    </div>

</div>

<script>

let tasks = [];
let pairs = [
    ["Farih","Rmaili"],
    ["Mandour","Banhadrya"],
    ["Amin","Ousama"],
    ["Anbry","Asli"]
];

function login(){

    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;
    let r = document.getElementById("role").value;

    if(u && p){

        document.getElementById("login").style.display="none";
        document.getElementById("dash").style.display="block";

        document.getElementById("roleBox").innerText = r;

        render();

    }

}

function addTask(){
    let t = document.getElementById("task").value;
    if(t){
        tasks.push(t);
        render();
    }
}

function render(){

    // OPS
    let o = "<tr><th>Task</th></tr>";
    tasks.forEach(t=>{
        o += `<tr><td>${t}</td></tr>`;
    });
    document.getElementById("ops").innerHTML = o;

    // PAIRS
    let p = "<tr><th>A</th><th>B</th></tr>";
    pairs.forEach(x=>{
        p += `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`;
    });
    document.getElementById("pairs").innerHTML = p;

    drawChart();

}

function drawChart(){

    new Chart(document.getElementById("chart"),{
        type:"bar",
        data:{
            labels:["Shift 1","Shift 2","Shift 3","Shift 4"],
            datasets:[{
                label:"RTG Productivity",
                data:[12,19,8,15],
                backgroundColor:"#00ff9d"
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display:false}
            }
        }
    });

}

</script>

</body>
</html>
