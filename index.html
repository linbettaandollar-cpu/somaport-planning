<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Operations Simulator</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#06121f;
    color:white;
}

/* LAYOUT */

.container{
    display:grid;
    grid-template-columns:250px 1fr 300px;
    height:100vh;
}

/* LEFT MENU */

.menu{
    background:#0b1a2c;
    padding:15px;
}

.menu h2{
    color:#00ff9d;
}

/* CENTER FLOW */

.flow{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.step{
    background:#0f2238;
    padding:15px;
    border-left:4px solid #00ff9d;
    border-radius:10px;
}

/* RIGHT PANEL */

.panel{
    background:#0b1a2c;
    padding:15px;
}

/* RTG SIM */

.rtg{
    width:100%;
    height:120px;
    background:#00ff9d22;
    border:1px solid #00ff9d55;
    border-radius:10px;
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* BUTTON */

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#00ff9d;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

    <!-- MENU -->
    <div class="menu">
        <h2>PORT OPS</h2>
        <p>RTG SYSTEM</p>
        <p>Containers</p>
        <p>Yard Control</p>
    </div>

    <!-- FLOW SYSTEM -->
    <div class="flow">

        <h2 style="color:#00ff9d;">🚢 Operation Flow</h2>

        <div class="step">1 - Vessel Arrival</div>
        <div class="step">2 - Container Unloading</div>
        <div class="step">3 - RTG Transfer</div>
        <div class="step">4 - Yard Storage</div>
        <div class="step">5 - Dispatch</div>

    </div>

    <!-- PANEL -->
    <div class="panel">

        <h3 style="color:#00ff9d;">RTG CONTROL</h3>

        <div class="rtg" id="rtg">RTG 8 - IDLE</div>

        <button onclick="run()">START OPERATION</button>

        <p id="status">Status: Waiting...</p>

    </div>

</div>

<script>

let steps = ["ARRIVAL","UNLOADING","TRANSFER","STORAGE","DONE"];
let i = 0;

function run(){

    let r = document.getElementById("rtg");
    let s = document.getElementById("status");

    let interval = setInterval(()=>{

        if(i >= steps.length){
            clearInterval(interval);
            r.innerText = "RTG 8 - IDLE";
            s.innerText = "Status: Completed";
            i = 0;
            return;
        }

        r.innerText = "RTG 8 - " + steps[i];
        s.innerText = "Status: " + steps[i];

        i++;

    },1200);

}

</script>

</body>
</html>
