<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTG Planning Dashboard | Somaport</title>
    <!-- مكتبات React و Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0c0c0c; color: white; }
        /* سكرول بار أنيق */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0c0c0c; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        function RTGPlanningDashboard() {
            // هادي هي البيانات اللي غتجي من Google Sheet مستقبلاً
            const shifts = [
                { crane: "RTG 01", operator: "Yassine", shift: "07:00 - 15:00", status: "Active" },
                { crane: "RTG 02", operator: "Hamza", shift: "15:00 - 23:00", status: "Pending" },
                { crane: "RTG 03", operator: "Ayoub", shift: "23:00 - 07:00", status: "Completed" },
                { crane: "RTG 04", operator: "Zakaria", shift: "07:00 - 15:00", status: "Active" },
            ];

            const statusStyle = {
                Active: "bg-green-500/20 text-green-300 border border-green-500/30",
                Pending: "bg-yellow-500/20 text-yellow-300 border border-yellow-500/30",
                Completed: "bg-blue-500/20 text-blue-300 border border-blue-500/30",
            };

            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-12 gap-6">
                            <div>
                                <p className="text-gray-500 uppercase tracking-widest text-xs mb-2">RTG OPERATIONS</p>
                                <h1 className="text-4xl md:text-6xl font-black">Smart Planning Dashboard</h1>
                            </div>
                            <div className="bg-[#171717] border border-white/10 rounded-3xl px-6 py-5 w-full md:w-80 shadow-2xl">
                                <p className="text-gray-400 text-sm mb-2">Today Schedule</p>
                                <h2 className="text-3xl font-bold">8 RTG</h2>
                                <div className="mt-4 flex items-center justify-between text-sm text-gray-300">
                                    <span>10 / 05 / 2026</span>
                                    <span>Port Operations</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                            <div className="bg-[#151515] rounded-3xl p-6 border border-white/5">
                                <p className="text-gray-400 text-sm mb-2">Active Teams</p>
                                <h3 className="text-4xl font-bold">12</h3>
                            </div>
                            <div className="bg-[#151515] rounded-3xl p-6 border border-white/5">
                                <p className="text-gray-400 text-sm mb-2">Night Shift</p>
                                <h3 className="text-4xl font-bold">04</h3>
                            </div>
                            <div className="bg-[#151515] rounded-3xl p-6 border border-white/5">
                                <p className="text-gray-400 text-sm mb-2">Completed Tasks</p>
                                <h3 className="text-4xl font-bold">28</h3>
                            </div>
                        </div>

                        <div className="bg-[#151515] rounded-[32px] border border-white/5 overflow-hidden shadow-2xl">
                            <div className="flex items-center justify-between px-6 py-5 border-b border-white/5">
                                <div>
                                    <h2 className="text-2xl font-semibold">Daily RTG Planning</h2>
                                    <p className="text-gray-400 text-sm mt-1">Operations and shift management</p>
                                </div>
                                <button className="bg-white text-black px-5 py-2 rounded-full font-medium hover:scale-105 transition-transform duration-300">
                                    Add Planning
                                </button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full min-w-[700px]">
                                    <thead>
                                        <tr className="text-left text-gray-400 text-sm border-b border-white/5">
                                            <th className="px-6 py-4 font-medium">RTG</th>
                                            <th className="px-6 py-4 font-medium text-right">Operator</th>
                                            <th className="px-6 py-4 font-medium text-right">Shift</th>
                                            <th className="px-6 py-4 font-medium text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {shifts.map((item, index) => (
                                            <tr key={index} className="border-b border-white/5 hover:bg-white/[0.02] transition-colors">
                                                <td className="px-6 py-5 font-semibold">{item.crane}</td>
                                                <td className="px-6 py-5 text-gray-300 text-right">{item.operator}</td>
                                                <td className="px-6 py-5 text-gray-300 text-right">{item.shift}</td>
                                                <td className="px-6 py-5 text-right">
                                                    <span className={`px-4 py-2 rounded-full text-xs font-semibold ${statusStyle[item.status]}`}>
                                                        {item.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="mt-10 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-[#151515] rounded-3xl p-6 border border-white/5">
                                <h3 className="text-xl font-semibold mb-4 text-right">Notes d'Opérations</h3>
                                <p className="text-gray-400 leading-7 text-right">
                                    يجب على جميع فرق RTG احترام توقيت المناوبات ولوائح السلامة. الفحص اليومي إلزامي قبل تشغيل الرافعة.
                                </p>
                            </div>
                            <div className="bg-gradient-to-br from-white to-gray-300 text-black rounded-3xl p-6 shadow-2xl">
                                <p className="uppercase tracking-[0.3em] text-xs mb-3 font-bold">Smart System</p>
                                <h3 className="text-3xl font-bold leading-tight mb-3 text-right">واجهة تخطيط حديثة</h3>
                                <p className="text-black/70 leading-7 text-right">
                                    تصميم مستوحى من أحدث المواقع العالمية، مع واجهة مستخدم نظيفة وسلسة لإدارة العمليات.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RTGPlanningDashboard />);
    </script>
</body>
</html>
