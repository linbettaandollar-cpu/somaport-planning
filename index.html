<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bamboo Style Slider</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Montserrat', sans-serif;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
      height:100vh;
      background:#000;
      color:#fff;
    }

    .slider{
      width:100%;
    }

    .slide{
      position:relative;
      width:100%;
      height:100vh;
      scroll-snap-align:start;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    .slide img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.35);
      z-index:-1;
    }

    /* Glassmorphism Card */
    .glass-card{
      width:min(90%, 420px);
      padding:32px;
      border-radius:28px;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.15);
      box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.15);
      text-align:center;
      transition:0.4s ease;
    }

    .glass-card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.16);
    }

    .binome{
      font-size:14px;
      letter-spacing:2px;
      text-transform:uppercase;
      opacity:0.8;
      margin-bottom:18px;
      font-weight:500;
    }

    .partners{
      font-family:'Cairo', sans-serif;
    }

    .partner{
      font-size:32px;
      font-weight:700;
      line-height:1.3;
    }

    .separator{
      width:70px;
      height:1px;
      background:rgba(255,255,255,0.4);
      margin:18px auto;
    }

    .loading{
      position:fixed;
      top:20px;
      right:20px;
      background:rgba(0,0,0,0.5);
      padding:10px 18px;
      border-radius:12px;
      backdrop-filter:blur(10px);
      font-size:14px;
      z-index:100;
    }

    @media(max-width:768px){
      .glass-card{
        padding:26px;
      }

      .partner{
        font-size:24px;
      }
    }
  </style>
</head>
<body>

  <div class="loading" id="loading">Loading...</div>

  <div class="slider" id="slider"></div>

  <script>
    // ====== API URL ======
    const API_URL = "رابط_الـ_API_ديالك";

    // ====== Unsplash Images ======
    const backgrounds = [
      "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1974&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1970&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=1970&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1974&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1974&auto=format&fit=crop"
    ];

    const slider = document.getElementById("slider");
    const loading = document.getElementById("loading");

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        loading.style.display = "none";

        data.forEach((item, index) => {
          const slide = document.createElement("section");
          slide.className = "slide";

          slide.innerHTML = `
            <img src="${backgrounds[index % backgrounds.length]}" alt="Background">
            <div class="overlay"></div>

            <div class="glass-card">
              <div class="binome">
                BINOME ${item.binome_number}
              </div>

              <div class="partners">
                <div class="partner">${item.partner1}</div>

                <div class="separator"></div>

                <div class="partner">${item.partner2}</div>
              </div>
            </div>
          `;

          slider.appendChild(slide);
        });

      } catch (error) {
        loading.innerHTML = "Error loading API";
        console.error(error);
      }
    }

    fetchData();
  </script>

</body>
</html>
