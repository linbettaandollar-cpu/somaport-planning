<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTG Planning - Somaport</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

:root{
    --green:#00ff9d;
    --dark:#07111f;
    --glass:rgba(255,255,255,0.06);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    background:linear-gradient(135deg,#040a14,#07111f,#0d1e36);
    color:white;
    padding:20px;
}

/* HEADER */

.header{
    text-align:center;
    padding:25px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

.header h1{
    font-size:34px;
    color:var(--green);
    font-weight:900;
}

.header h2{
    font-size:22px;
    margin-top:5px;
}

/* RTG BOX */

.rtg{
    margin-top:15px;
    font-size:28px;
    font-weight:900;
    color:#fff;
    background:#00ff9d22;
    display:inline-block;
    padding:8px 25px;
    border-radius:20px;
}

/* SECTION */

.section{
    margin-top:20px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.08);
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:12px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.1);
    font-size:18px;
}

th{
    color:var(--green);
    font-size:20px;
}

/* PAIRS STYLE */

.pair{
    font-weight:700;
}

/* CONGÉ */

.conge{
    font-size:20px;
    text-align:center;
    line-height:2;
}

/* MOBILE */

@media(max-width:700px){
    td,th{
        font-size:15px;
    }

    .header h1{
        font-size:26px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Somaport - RTG Planning</h1>
    <h2>Dimanche 10/05/2026</h2>
    <div class="rtg">🚜 RTG N° 8</div>
</div>

<!-- PAIRS -->
<div class="section">

    <h2 style="text-align:center;color:var(--green);margin-bottom:15px;">
        👥 Les Binômes
    </h2>

    <table>

        <tr>
            <td class="pair">Farih</td>
            <td>//</td>
            <td class="pair">Rmaili</td>
        </tr>

        <tr>
            <td class="pair">Mandour</td>
            <td>//</td>
            <td class="pair">Banhadrya</td>
        </tr>

        <tr>
            <td class="pair">Amin</td>
            <td>//</td>
            <td class="pair">Ousama</td>
        </tr>

        <tr>
            <td class="pair">Anbry</td>
            <td>//</td>
            <td class="pair">Asli</td>
        </tr>

        <tr>
            <td class="pair">Bentata</td>
            <td>//</td>
            <td class="pair">Madak</td>
        </tr>

        <tr>
            <td class="pair">Jaaouiani</td>
            <td>//</td>
            <td class="pair">Errakhmi</td>
        </tr>

        <tr>
            <td class="pair">Lamnabbah</td>
            <td>//</td>
            <td class="pair">Ramadan</td>
        </tr>

        <tr>
            <td class="pair">Zaoui</td>
            <td>//</td>
            <td class="pair">Mabsout</td>
        </tr>

    </table>

</div>

<!-- CONGÉ -->
<div class="section">

    <h2 style="text-align:center;color:var(--green);margin-bottom:15px;">
        🏖️ Congé
    </h2>

    <div class="conge">

        <strong>Balhawi</strong><br>
        (Sorti) Lundi<br>
        (Entré) Lundi soir

    </div>

</div>

</body>
</html>
