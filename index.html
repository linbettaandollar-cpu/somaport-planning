<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somaport Elite Planning</title>
    <!-- خطوط احترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&family=Montserrat:wght@100;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #c5a059; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            background: #000; 
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* حاوية السكرول */
        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .slide {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* طبقة الصورة الخلفية HD */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; /* هادي هي اللي كتخلي الصورة تبان HD ومقادة */
            z-index: -1;
            filter: brightness(0.6); /* باش الكلمات يبانو بوضوح */
        }

        /* إطار المعلومات المستوحى من Bamboo */
        .content-card {
            background: rgba(255, 255, 255, 0.08); /* زجاج شفاف جداً */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 60px 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            letter-spacing: 8px;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .category {
            color: var(--gold);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 4px;
            font-weight: 600;
            margin-bottom: 40px;
            display: block;
        }

        .names {
            font-weight: 300;
            font-size: 2.2rem;
            line-height: 1.4;
            margin: 20px 0;
        }

        .line {
            width: 30px;
            height: 1px;
            background: var(--gold);
            margin: 30px auto;
        }

        /* صفحة العطلة */
        .conge-style { border-color: #ff4d4d; }
        .conge-text { color: #ff4d4d; font-weight: 600; }

        /* Loader */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; color: white; display: flex;
            justify-content: center; align-items: center; z-index: 999;
        }
    </style>
</head>
<body>

<div id="loader">SOMAPORT ELITE LOADING...</div>

<div class="snap-container" id="app">
    <!-- الصفحة الأولى (مثال ثابت) -->
    <div class="slide">
        <img class="bg-image" src="https://images.unsplash.com/photo-1570114000300-843e18ec33e4?auto=format&fit=crop&q=80&w=1600" alt="background">
        <div class="content-card">
            <div class="logo">SOMAPORT</div>
            <span class="category">RTG 8 Planning</span>
            <div class="line"></div>
            <div class="names" id="main-date" style="font-size: 1.2rem;">...</div>
        </div>
    </div>
</div>

<script>
    const API = "https://api.sheetbest.com/sheets/b6e3ae1f-2190-406c-8264-091975545af0";
    
    // مجموعة صور HD للميناء والآليات
    const images = [
        "https://images.unsplash.com/photo-1494412574005-06788647cc54?auto=format&fit=crop&q=80&w=1600",
        "https://images.unsplash.com/photo-1520102188090-c8b80c55c472?auto=format&fit=crop&q=80&w=1600",
        "https://images.unsplash.com/photo-1516216628859-9bccecab13ca?auto=format&fit=crop&q=80&w=1600",
        "https://images.unsplash.com/photo-1510673398445-94f476ef2cbc?auto=format&fit=crop&q=80&w=1600"
    ];

    document.getElementById('main-date').innerText = new Date().toLocaleDateString('ar-MA', {weekday:'long', day:'numeric', month:'long'});

    async function load() {
        try {
            const res = await fetch(API);
            const data = await res.json();
            const app = document.getElementById('app');
            document.getElementById('loader').style.display = 'none';

            data.forEach((item, index) => {
                const get = (k) => {
                    const key = Object.keys(item).find(s => s.trim() === k);
                    return key ? item[key] : '';
                };

                const b = get('binome_number');
                const p1 = get('partner1');
                const p2 = get('partner2');

                if(!b && !p1) return;

                const isC = b.toUpperCase().includes('CONGÉ');
                const imgUrl = images[index % images.length]; // تبديل الصور أوتوماتيكياً

                const slide = `
                    <div class="slide">
                        <img class="bg-image" src="${imgUrl}" alt="bg">
                        <div class="content-card ${isC ? 'conge-style' : ''}">
                            <div class="logo">SOMAPORT</div>
                            <span class="category">${isC ? 'OFF DUTY' : 'Binôme ' + b}</span>
                            <div class="names">${p1}</div>
                            <div class="line"></div>
                            <div class="names" style="${isC ? 'font-size:1.5rem; color:var(--gold);' : ''}">
                                ${isC ? p2.replace('In:', 'دخول:').replace('Out:', 'خروج:') : p2}
                            </div>
                        </div>
                    </div>
                `;
                app.innerHTML += slide;
            });
        } catch(e) { console.log(e); }
    }
    load();
</script>
</body>
</html>
