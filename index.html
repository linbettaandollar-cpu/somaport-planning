<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTG Planning - Fullscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #003366; --orange: #ff6600; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #000; 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden; /* منع السكرول العادي */
        }

        /* حاوية السلايدر */
        .slider-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* نظام الصفحات */
            scroll-behavior: smooth;
        }

        .slide {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }

        /* لوغو SOMAPORT ثابت فكل صفحة */
        .page-header {
            position: absolute;
            top: 40px;
            text-align: center;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            color: var(--blue);
            letter-spacing: -1px;
        }

        .binome-title {
            font-size: 2.5rem;
            color: var(--orange);
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .names-card {
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 10px solid var(--blue);
        }

        .p-name {
            display: block;
            font-size: 2.2rem;
            color: #1e293b;
            margin: 15px 0;
            font-weight: 800;
        }

        .divider {
            height: 2px;
            background: #e2e8f0;
            width: 60%;
            margin: 0 auto;
        }

        /* ستايل خاص بالعطلة */
        .conge-slide {
            background: linear-gradient(135deg, #fff1f2 0%, #fff 100%);
        }
        .conge-slide .binome-title { color: #e11d48; }
        .conge-card { border-top-color: #e11d48; }
        .arabic-info {
            font-size: 1.5rem;
            color: #475569;
            direction: rtl;
            line-height: 1.8;
        }

        #loader {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.5rem;
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="loader">جاري التحميل...</div>
    <div class="slider-container" id="slider"></div>

    <script>
        const apiURL = "https://api.sheetbest.com/sheets/b6e3ae1f-2190-406c-8264-091975545af0";

        async function loadPlanning() {
            try {
                const res = await fetch(apiURL);
                const data = await res.json();
                const slider = document.getElementById('slider');
                document.getElementById('loader').style.display = 'none';

                data.forEach((item, index) => {
                    const clean = (key) => {
                        const found = Object.keys(item).find(k => k.trim() === key);
                        return found ? item[found] : '';
                    };

                    const bNumber = clean('binome_number');
                    const p1 = clean('partner1');
                    const p2 = clean('partner2');

                    if(!bNumber && !p1) return;

                    const isConge = bNumber.toUpperCase().includes('CONGÉ');
                    
                    let content = '';
                    if(isConge) {
                        // ترجمة معلومات العطلة للعربية
                        const arabicP2 = p2.replace('In:', 'دخول:').replace('Out:', 'خروج:').replace('Lundi', 'الإثنين');
                        content = `
                            <div class="names-card conge-card">
                                <span class="p-name">${p1}</span>
                                <div class="divider"></div>
                                <div class="arabic-info" style="margin-top:20px;">
                                    ${arabicP2}
                                </div>
                            </div>
                        `;
                    } else {
                        content = `
                            <div class="names-card">
                                <span class="p-name">${p1}</span>
                                <div class="divider"></div>
                                <span class="p-name">${p2}</span>
                            </div>
                        `;
                    }

                    const slideHtml = `
                        <div class="slide ${isConge ? 'conge-slide' : ''}">
                            <div class="page-header">
                                <h1 class="logo">SOMAPORT</h1>
                            </div>
                            <h2 class="binome-title">${bNumber}</h2>
                            ${content}
                            <div class="scroll-hint">اسحب للأعلى لرؤية المزيد ↓</div>
                        </div>
                    `;
                    slider.innerHTML += slideHtml;
                });
            } catch (e) {
                document.getElementById('loader').innerText = "خطأ في الاتصال";
            }
        }

        loadPlanning();
    </script>
</body>
</html>
