<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Somaport Planning Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #003366; --orange: #ff6600; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #0f172a; 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden; 
        }

        .slider-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .slide {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: white;
            text-align: center;
        }

        /* الصفحة الأولى - الواجهة */
        .hero-title { font-family: 'Outfit', sans-serif; font-size: 3.5rem; color: var(--orange); margin-bottom: 10px; }
        .hero-sub { font-size: 2rem; font-weight: 900; color: var(--white); margin-bottom: 20px; }
        .hero-date { background: var(--blue); padding: 10px 30px; border-radius: 50px; font-size: 1.2rem; border: 2px solid var(--orange); }

        /* ستايل إطار العمال */
        .worker-cadre {
            background: var(--white);
            width: 100%;
            max-width: 350px;
            padding: 50px 20px;
            border-radius: 40px;
            border: 8px solid var(--blue);
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.2);
            position: relative;
        }
        .binome-num { 
            position: absolute; 
            top: -25px; 
            background: var(--orange); 
            padding: 5px 25px; 
            border-radius: 15px; 
            font-size: 1.4rem;
            font-weight: 900;
        }
        .worker-name { color: #1e293b; font-size: 2.5rem; font-weight: 900; margin: 10px 0; display: block; }
        .vs-line { height: 3px; background: #cbd5e1; width: 50%; margin: 15px auto; }

        /* صفحة التحفيز */
        .moto-card { border: 4px dashed var(--orange); padding: 30px; border-radius: 30px; }
        .moto-text { font-size: 1.8rem; line-height: 1.6; color: var(--orange); }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            animation: bounce 2s infinite;
            font-size: 0.9rem;
            color: #64748b;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="slider" class="slider-container">
        <!-- الصفحة 1: الواجهة -->
        <div class="slide">
            <h1 class="hero-title">SOMAPORT</h1>
            <h2 class="hero-sub">(8) RTG PLANNING</h2>
            <div class="hero-date" id="today-date">...</div>
            <div class="scroll-down">اسحب للأعلى للبدء ↓</div>
        </div>

        <!-- هنا غيتحطو صفحات العمال أوتوماتيكيا -->

        <!-- الصفحة الأخيرة: التحفيز (غتزاد أوتوماتيكيا فالتالي) -->
    </div>

    <script>
        const apiURL = "https://api.sheetbest.com/sheets/b6e3ae1f-2190-406c-8264-091975545af0";

        // تحديث التاريخ بالعر بية
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('today-date').innerText = new Date().toLocaleDateString('ar-MA', dateOptions);

        async function loadApp() {
            try {
                const res = await fetch(apiURL);
                const data = await res.json();
                const slider = document.getElementById('slider');

                data.forEach((item) => {
                    const clean = (key) => {
                        const found = Object.keys(item).find(k => k.trim() === key);
                        return found ? item[found] : '';
                    };

                    const bNumber = clean('binome_number');
                    const p1 = clean('partner1');
                    const p2 = clean('partner2');

                    if(!bNumber && !p1) return;

                    const isConge = bNumber.toUpperCase().includes('CONGÉ');
                    
                    let slideContent = '';
                    if(isConge) {
                        // صفحة العطلة
                        slideContent = `
                            <div class="slide" style="background: linear-gradient(180deg, #450a0a 0%, #0f172a 100%);">
                                <div class="worker-cadre" style="border-color: #ef4444;">
                                    <div class="binome-num" style="background: #ef4444;">وضعية العطلة</div>
                                    <span class="worker-name">${p1}</span>
                                    <div class="vs-line"></div>
                                    <div style="color:#475569; font-size:1.5rem; direction:rtl;">
                                        ${p2.replace('In:', 'دخول:').replace('Out:', 'خروج:').replace('Lundi', 'الإثنين')}
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // صفحات العمال
                        slideContent = `
                            <div class="slide">
                                <div class="worker-cadre">
                                    <div class="binome-num">${bNumber}</div>
                                    <span class="worker-name">${p1}</span>
                                    <div class="vs-line"></div>
                                    <span class="worker-name">${p2}</span>
                                </div>
                            </div>
                        `;
                    }
                    slider.innerHTML += slideContent;
                });

                // إضافة صفحة التحفيز فالتالي
                const motivationSlide = `
                    <div class="slide" style="background: #0f172a;">
                        <div class="moto-card">
                            <h2 style="color:white; margin-bottom:20px;">نصيحة اليوم</h2>
                            <p class="moto-text">
                                👷‍♂️ السلامة أولاً.. رد بالك على راسك وعلى خوتك <br><br>
                                ✨ يوم عمل سعيد وموفق للجميع <br><br>
                                💪 خدم بقلبك، ربي كيشوف كولشي
                            </p>
                        </div>
                        <div style="margin-top:40px; color:#64748b;">SOMAPORT RTG TEAM 2026</div>
                    </div>
                `;
                slider.innerHTML += motivationSlide;

            } catch (e) {
                console.log("Error");
            }
        }

        loadApp();
    </script>
</body>
</html>
