<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somaport Planning | Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bamboo-dark: #1a1a1a;
            --bamboo-gold: #c5a059; /* لون ذهبي خفيف بحال Bamboo */
            --bamboo-grey: #f9f9f9;
            --text-main: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: white; 
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header Style Bamboo */
        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .brand {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--bamboo-dark);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .sub-brand {
            font-size: 0.9rem;
            color: var(--bamboo-gold);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .date-display {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #888;
            font-weight: 300;
        }

        /* Planning Section */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 400;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: var(--bamboo-gold);
            margin: 10px auto;
        }

        .worker-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s ease;
        }

        .worker-card:hover {
            padding-right: 10px;
            border-bottom-color: var(--bamboo-gold);
        }

        .binome-info {
            flex: 1;
        }

        .binome-tag {
            font-size: 0.75rem;
            color: var(--bamboo-gold);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .names-group {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--bamboo-dark);
        }

        .names-group span {
            color: #ccc;
            font-weight: 300;
            margin: 0 10px;
        }

        /* Congé Section */
        .conge-box {
            margin-top: 50px;
            background: var(--bamboo-grey);
            padding: 40px;
            text-align: center;
            border-radius: 2px;
        }

        .conge-box h3 {
            color: #e63946;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        /* Footer Motivation */
        footer {
            padding: 80px 20px;
            background: var(--bamboo-dark);
            color: white;
            text-align: center;
            margin-top: 60px;
        }

        .quote {
            font-style: italic;
            font-size: 1.2rem;
            max-width: 500px;
            margin: 0 auto 20px;
            font-weight: 300;
        }

        .safety-badge {
            display: inline-block;
            border: 1px solid var(--bamboo-gold);
            padding: 5px 20px;
            color: var(--bamboo-gold);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        #loader { text-align: center; padding: 40px; color: var(--bamboo-gold); }
    </style>
</head>
<body>

    <header>
        <div class="brand">SOMAPORT</div>
        <div class="sub-brand">RTG 8 • ELITE CREW</div>
        <div class="date-display" id="date-text">...</div>
    </header>

    <div class="container">
        <h2 class="section-title">برنامج العمل اليومي</h2>
        
        <div id="loader">جاري تحميل البيانات الفاخرة...</div>
        <div id="planning-list"></div>

        <div id="conge-section" style="display: none;"></div>
    </div>

    <footer>
        <p class="quote">"النجاح ليس صدفة، بل هو نتيجة التركيز والعمل الجماعي المتقن."</p>
        <div class="safety-badge">السلامة أولاً • Safety First</div>
        <p style="margin-top: 20px; font-size: 0.7rem; color: #555;">SOMAPORT LOGISTICS 2026</p>
    </footer>

    <script>
        const API = "https://api.sheetbest.com/sheets/b6e3ae1f-2190-406c-8264-091975545af0";

        // التاريخ
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('date-text').innerText = new Date().toLocaleDateString('ar-MA', options);

        async function loadData() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                const list = document.getElementById('planning-list');
                const conge = document.getElementById('conge-section');
                document.getElementById('loader').style.display = 'none';

                data.forEach(item => {
                    const get = (k) => {
                        const key = Object.keys(item).find(s => s.trim() === k);
                        return key ? item[key] : '';
                    };

                    const b = get('binome_number');
                    const p1 = get('partner1');
                    const p2 = get('partner2');

                    if(!b && !p1) return;

                    if(b.toUpperCase().includes('CONGÉ')) {
                        conge.style.display = 'block';
                        conge.innerHTML = `
                            <div class="conge-box">
                                <h3>وضعية الاستراحة والعطل</h3>
                                <p style="font-size:1.3rem; font-weight:700;">${p1}</p>
                                <p style="color:#888; margin-top:10px;">${p2.replace('In:', 'دخول:').replace('Out:', 'خروج:')}</p>
                            </div>
                        `;
                    } else {
                        list.innerHTML += `
                            <div class="worker-card">
                                <div class="binome-info">
                                    <span class="binome-tag">Binôme ${b}</span>
                                    <div class="names-group">${p1} <span>|</span> ${p2}</div>
                                </div>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                document.getElementById('loader').innerText = "فشل في الاتصال بالسيرفر";
            }
        }

        loadData();
    </script>
</body>
</html>
